<!DOCTYPE html>
<html lang="en">
  <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Daily Highlight</title>
      <style>
                * {
                              margin: 0;
                              padding: 0;
                              box-sizing: border-box;
                }

                body {
                              min-height: 100vh;
                              display: flex;
                              flex-direction: column;
                              align-items: center;
                              justify-content: center;
                              font-family: Georgia, 'Times New Roman', serif;
                              background: #faf9f6;
                              color: #2c2c2c;
                              padding: 2rem;
                }

                .container {
                              max-width: 700px;
                              text-align: center;
                }

                .date {
                              font-size: 0.9rem;
                              letter-spacing: 0.15em;
                              text-transform: uppercase;
                              color: #888;
                              margin-bottom: 2rem;
                }

                .word {
                              font-size: 0.8rem;
                              letter-spacing: 0.3em;
                              text-transform: uppercase;
                              color: #b8860b;
                              margin-bottom: 1.5rem;
                              font-weight: 500;
                }

                .highlight {
                              font-size: 1.5rem;
                              line-height: 1.8;
                              font-style: italic;
                              margin-bottom: 2rem;
                }

                .source {
                              font-size: 0.85rem;
                              color: #666;
                }

                .source .book {
                              font-style: italic;
                }

                .loading {
                              color: #888;
                }

                .setup-notice {
                              background: #fff3cd;
                              border: 1px solid #ffc107;
                              padding: 1.5rem;
                              border-radius: 8px;
                              margin-top: 2rem;
                              font-size: 0.9rem;
                              text-align: left;
                }

                .setup-notice code {
                              background: #f5f5f5;
                              padding: 0.2rem 0.4rem;
                              border-radius: 3px;
                              font-family: monospace;
                }
            </style>
  </head>
  <body>
        <div class="container">
                  <div class="date" id="date"></div>
                  <div class="word" id="word"></div>
                  <div class="highlight" id="highlight">Loading today's highlight...</div>
                  <div class="source" id="source"></div>
        </div>

        <script>
                  const READWISE_TOKEN = localStorage.getItem('readwise_token') || '';

                  const themeWords = [
                                'reflect', 'wonder', 'grow', 'create', 'connect', 'explore', 'dream',
                                'learn', 'embrace', 'discover', 'imagine', 'persist', 'breathe', 'focus',
                                'trust', 'evolve', 'inspire', 'question', 'build', 'seek', 'listen',
                                'observe', 'understand', 'appreciate', 'transform', 'simplify', 'begin',
                                'courage', 'patience', 'wisdom', 'clarity', 'purpose', 'balance', 'truth',
                                'change', 'hope', 'strength', 'presence', 'depth', 'flow', 'light'
                            ];

                  function formatDate(date) {
                                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                                return date.toLocaleDateString('en-US', options);
                  }

                  function getDailySeed() {
                                const today = new Date();
                                return today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
                  }

                  function seededRandom(seed) {
                                const x = Math.sin(seed) * 10000;
                                return x - Math.floor(x);
                  }

                  function pickFromSeed(array, seed) {
                                const index = Math.floor(seededRandom(seed) * array.length);
                                return array[index];
                  }

                  function displayHighlight(highlight, seed) {
                                document.getElementById('date').textContent = formatDate(new Date());
                                document.getElementById('word').textContent = pickFromSeed(themeWords, seed + 1);
                                document.getElementById('highlight').textContent = highlight.text;

                                let sourceText = '';
                                if (highlight.title) {
                                                  sourceText = highlight.title;
                                                  if (highlight.author) {
                                                                        sourceText += ' by ' + highlight.author;
                                                  }
                                }
                                document.getElementById('source').textContent = sourceText;
                  }

                  async function fetchHighlights() {
                                if (!READWISE_TOKEN) {
                                                  showSetupNotice();
                                                  return null;
                                }

                                try {
                                                  const response = await fetch('https://readwise.io/api/v2/highlights/?page_size=1000', {
                                                                        headers: {
                                                                                                  'Authorization': 'Token ' + READWISE_TOKEN
                                                                          }
                                                  });

                                                  if (!response.ok) {
                                                                        throw new Error('API request failed');
                                                  }

                                                  const data = await response.json();
                                                  return data.results;
                                } catch (error) {
                                                  console.error('Error fetching highlights:', error);
                                                  document.getElementById('highlight').textContent = 'Error loading highlight. Please check your API token.';
                                                  return null;
                                }
                  }

                  function showSetupNotice() {
                                document.getElementById('highlight').textContent = 'Welcome to Daily Highlight';
                                const notice = document.createElement('div');
                                notice.className = 'setup-notice';
                                notice.innerHTML = '<strong>Setup Required:</strong><br><br>' +
                                                  '1. Get your Readwise API token from <a href="https://readwise.io/access_token" target="_blank">readwise.io/access_token</a><br><br>' +
                                                  '2. Open browser console (F12) and run:<br>' +
                                                  '<code>localStorage.setItem(\'readwise_token\', \'YOUR_TOKEN_HERE\')</code><br><br>' +
                                                  '3. Refresh this page';
                                document.getElementById('source').appendChild(notice);
                  }

                  async function main() {
                                const seed = getDailySeed();
                                document.getElementById('date').textContent = formatDate(new Date());

                                const highlights = await fetchHighlights();

                                if (highlights && highlights.length > 0) {
                                                  const todaysHighlight = pickFromSeed(highlights, seed);
                                                  displayHighlight(todaysHighlight, seed);
                                }
                  }

                  main();
        </script>
  </body>
</html>
        </script>
  </body>
      </style></title>
  </head>
